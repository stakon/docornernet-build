name: Build MobileNetV3 TFLite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CUDA_VISIBLE_DEVICES: "-1"

    steps:
      - name: Скачать проверенную версию DocCornerNet
        uses: actions/checkout@v4
        with:
          repository: mapo80/DocCornerNet-CoordClass
          ref: d877dc382c4ec56299d2b2662b979581bae9c8cd
          lfs: true

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Проверить наличие весов
        run: |
          test -s checkpoints/mobilenetv3_224/best_model.weights.h5
          test -s checkpoints/mobilenetv3_224/config.json
          ls -lh checkpoints/mobilenetv3_224/best_model.weights.h5

      - name: Исправить печать выходов в программе экспорта
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("export.py")
          text = path.read_text()

          old = "\n".join([
              '    print(f"  coords shape: {outputs[\'coords\'].shape}")',
              '    print(f"  score shape: {outputs[\'score\'].shape}")',
          ])

          new = "\n".join([
              '    if isinstance(outputs, dict):',
              '        for name, value in outputs.items():',
              '            print(f"  output {name}: shape={value.shape}, dtype={value.dtype}")',
              '    elif isinstance(outputs, (list, tuple)):',
              '        print(f"  model.output_names: {model.output_names}")',
              '        for index, value in enumerate(outputs):',
              '            print(f"  output[{index}]: shape={value.shape}, dtype={value.dtype}")',
              '    else:',
              '        print(f"  output: shape={outputs.shape}, dtype={outputs.dtype}")',
          ])

          count = text.count(old)
          if count != 1:
              raise SystemExit(
                  f"Expected diagnostic block exactly once; found {count}"
              )

          updated = text.replace(old, new, 1)
          compile(updated, str(path), "exec")
          path.write_text(updated)
          print("Diagnostic output fixed; model computation unchanged.")
          PY

      - name: Экспортировать MobileNetV3 в TFLite Float32
        run: |
          python export.py \
            --weights checkpoints/mobilenetv3_224/best_model.weights.h5 \
            --output_dir exported \
            --format tflite

      - name: Проверить результат
        run: |
          test -s exported/model_float32.tflite
          ls -lh exported/model_float32.tflite
          cat exported/export_results.json

      - name: Сохранить модель и отчёт
        uses: actions/upload-artifact@v4
        with:
          name: mobilenetv3-224-float32
          path: |
            exported/model_float32.tflite
            exported/export_results.json
            checkpoints/mobilenetv3_224/config.json
          if-no-files-found: error
          retention-days: 7
