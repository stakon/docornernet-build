name: Check DocCornerNet

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Скачать исходники DocCornerNet
        uses: actions/checkout@v4
        with:
          repository: mapo80/DocCornerNet-CoordClass
          ref: main
          lfs: false

      - name: Проверить веса и программы экспорта
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Версия исходников ==="
          git rev-parse HEAD

          echo "=== Файлы в корне проекта ==="
          ls -lah

          echo "=== Веса, конфигурации и файлы экспорта ==="
          git ls-files | grep -Ei \
            '(^checkpoints/|export|convert|requirements|mobilenetv3|\.pth$|\.pt$|\.ckpt$|\.h5$|\.keras$|\.tflite$|\.onnx$)' \
            || true

          echo "=== Упоминания MobileNetV3 и команд экспорта ==="
          git grep -n -I -i -E \
            'mobilenetv3|export_tflite|representative_dataset|int8io|add_argument' \
            -- '*.py' '*.md' '*.yaml' '*.yml' '*.json' '*.txt' \
            | head -n 350 || true
