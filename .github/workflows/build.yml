name: Build TFLite

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Скачать DocCornerNet
        uses: actions/checkout@v4
        with:
          repository: mapo80/DocCornerNet-CoordClass
          ref: main

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install huggingface_hub

      - name: Скачать калибровочный датасет
        run: |
          huggingface-cli download mapo80/DocCornerDataset \
            --repo-type dataset \
            --local-dir ./data

      - name: Собрать mobilenetv3_224 INT8
        run: |
          python export_tflite_int8.py \
            --checkpoint ./checkpoints/mobilenetv3_224 \
            --data_root ./data \
            --split val_cleaned \
            --quantization int8 \
            --io_dtype int8 \
            --output_dtype int8 \
            --output ./mobilenetv3_224_int8.tflite

      - name: Сохранить модель как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: tflite-model
          path: ./*.tflite
