name: Build MobileNetV3 TFLite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      CUDA_VISIBLE_DEVICES: "-1"

    steps:
      - name: Скачать проверенную версию DocCornerNet
        uses: actions/checkout@v4
        with:
          repository: mapo80/DocCornerNet-CoordClass
          ref: d877dc382c4ec56299d2b2662b979581bae9c8cd
          lfs: true

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Установить зависимости
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Проверить наличие весов
        run: |
          test -s checkpoints/mobilenetv3_224/best_model.weights.h5
          test -s checkpoints/mobilenetv3_224/config.json
          ls -lh checkpoints/mobilenetv3_224/best_model.weights.h5

      - name: Экспортировать MobileNetV3 в TFLite Float32
        run: |
          python export.py \
            --weights checkpoints/mobilenetv3_224/best_model.weights.h5 \
            --output_dir exported \
            --format tflite

      - name: Проверить результат
        run: |
          test -s exported/model_float32.tflite
          ls -lh exported/model_float32.tflite
          cat exported/export_results.json

      - name: Сохранить модель и отчёт
        uses: actions/upload-artifact@v4
        with:
          name: mobilenetv3-224-float32
          path: |
            exported/model_float32.tflite
            exported/export_results.json
            checkpoints/mobilenetv3_224/config.json
          if-no-files-found: error
          retention-days: 7
